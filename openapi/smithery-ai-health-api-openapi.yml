openapi: 3.2.0
info:
  title: Smithery Registry Health API
  version: 1.0.0
  description: Discover and manage MCP servers, skills, and tools on Smithery. Browse the public registry, publish releases, manage server icons/secrets/logs, create namespaces, manage organization API keys, and mint scoped service tokens.
servers:
- url: https://api.smithery.ai
tags:
- name: Health
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Check if the service is running
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: Service unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthError'
      tags:
      - Health
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
      required:
      - status
      - timestamp
      additionalProperties: false
    HealthError:
      type: object
      properties:
        error:
          type: string
          example: Service unhealthy
      required:
      - error
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Smithery API key as Bearer token
