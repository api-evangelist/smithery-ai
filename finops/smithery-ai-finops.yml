    description: Per-server subscription on Hobby, Pro, or Custom hosting plans.
  - name: external-registry-listing
    description: Free — external servers listed on Smithery's public registry have no associated cost.
  - name: observability-insights
    description: Free for both hosted and external servers.
  - name: bandwidth
    description: Bandwidth usage may apply to high-traffic hosted servers on Pro/Custom plans.
discounts:
  - name: free-external-listing
    description: Servers hosted on customer-owned infrastructure can be listed on Smithery's public
      registry for free, with free observability insights.
